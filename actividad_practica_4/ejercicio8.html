<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ejercicio 8 - Alquiler de automóvil</title>
</head>
<body>
    <h1>Alquiler de automóvil</h1>
    <p>
        <label for="kilometros">Kilómetros recorridos</label>
        <input type="number" id="kilometros" min="0" step="any" required>
    </p>
    <button type="button" onclick="calcularAlquiler()">Calcular</button>
    <div id="resultado" role="status"></div>

    <script>
        function calcularAlquiler() {
            const valorKilometros = document.getElementById("kilometros").value;
            const kilometros = Number(valorKilometros);
            const resultado = document.getElementById("resultado");

            if (valorKilometros === "" || !Number.isFinite(kilometros) || kilometros < 0) {
                resultado.innerHTML = "<p>Ingresa una cantidad de kilómetros mayor o igual a cero.</p>";
                return;
            }

            let total = 30;
            if (kilometros > 1000) {
                total = 30 + (1000 - 300) * 0.25 + (kilometros - 1000) * 0.50;
            } else if (kilometros > 300) {
                total = 30 + (kilometros - 300) * 0.25;
            }

            const montoSinIVA = total / 1.13;
            const iva = total - montoSinIVA;

            resultado.innerHTML =
                "<p>Kilómetros recorridos: " + kilometros + " km</p>" +
                "<p>Total a pagar: $" + total.toFixed(2) + "</p>" +
                "<p>Valor sin IVA: $" + montoSinIVA.toFixed(2) + "</p>" +
                "<p>IVA incluido: $" + iva.toFixed(2) + "</p>";
        }
    </script>
</body>
</html>
