<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ejercicio 4 - Número par o impar</title>
</head>
<body>
    <h1>Número par o impar</h1>
    <p>
        <label for="numero">Número entero</label>
        <input type="number" id="numero" step="1" required>
    </p>
    <button type="button" onclick="verificarNumero()">Verificar</button>
    <div id="resultado" role="status"></div>

    <script>
        function verificarNumero() {
            const valorNumero = document.getElementById("numero").value;
            const numero = Number(valorNumero);
            const resultado = document.getElementById("resultado");

            if (valorNumero === "" || !Number.isInteger(numero)) {
                resultado.innerHTML = "<p>Ingresa un número entero.</p>";
                return;
            }

            if (numero % 2 === 0) {
                resultado.innerHTML = "<p>" + numero + " es par.</p>";
            } else {
                resultado.innerHTML = "<p>" + numero + " es impar.</p>";
            }
        }
    </script>
</body>
</html>
