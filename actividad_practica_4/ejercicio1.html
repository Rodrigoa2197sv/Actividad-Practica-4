<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ejercicio 1 - Año bisiesto</title>
</head>
<body>
    <h1>Año bisiesto</h1>
    <p>
        <label for="anio">Año</label>
        <input type="number" id="anio" min="1" step="1" required>
    </p>
    <button type="button" onclick="verificarAnio()">Verificar</button>
    <div id="resultado" role="status"></div>

    <script>
        function verificarAnio() {
            const valorAnio = document.getElementById("anio").value;
            const anio = Number(valorAnio);
            const resultado = document.getElementById("resultado");

            if (valorAnio === "" || !Number.isInteger(anio) || anio < 1) {
                resultado.innerHTML = "<p>Ingresa un año entero mayor que cero.</p>";
                return;
            }

            if ((anio % 4 === 0 && anio % 100 !== 0) || anio % 400 === 0) {
                resultado.innerHTML = "<p>" + anio + " es un año bisiesto.</p>";
            } else {
                resultado.innerHTML = "<p>" + anio + " no es un año bisiesto.</p>";
            }
        }
    </script>
</body>
</html>
