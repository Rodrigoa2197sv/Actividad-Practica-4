<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ejercicio 5 - Hora futura</title>
</head>
<body>
    <h1>Hora futura</h1>
    <p>
        <label for="horaActual">Hora actual (0 a 23)</label>
        <input type="number" id="horaActual" min="0" max="23" step="1" required>
    </p>
    <p>
        <label for="horasAdicionales">Horas adicionales</label>
        <input type="number" id="horasAdicionales" min="0" step="1" required>
    </p>
    <button type="button" onclick="calcularHora()">Calcular</button>
    <div id="resultado" role="status"></div>

    <script>
        function calcularHora() {
            const valorHora = document.getElementById("horaActual").value;
            const valorHoras = document.getElementById("horasAdicionales").value;
            const horaActual = Number(valorHora);
            const horasAdicionales = Number(valorHoras);
            const resultado = document.getElementById("resultado");

            if (valorHora === "" || !Number.isInteger(horaActual) || horaActual < 0 || horaActual > 23) {
                resultado.innerHTML = "<p>Ingresa una hora actual entera entre 0 y 23.</p>";
                return;
            }
            if (valorHoras === "" || !Number.isInteger(horasAdicionales) || horasAdicionales < 0) {
                resultado.innerHTML = "<p>Ingresa una cantidad entera de horas adicionales mayor o igual a cero.</p>";
                return;
            }

            const horaFutura = (horaActual + (horasAdicionales % 24)) % 24;
            let horaMostrada = horaFutura;
            if (horaFutura < 10) {
                horaMostrada = "0" + horaFutura;
            }

            resultado.innerHTML = "<p>El reloj marcará las " + horaMostrada + " horas.</p>";
        }
    </script>
</body>
</html>
