<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ejercicio 7 - Descuento de supermercado</title>
</head>
<body>
    <h1>Descuento de supermercado</h1>
    <p>
        <label for="docenas">Cantidad de docenas</label>
        <input type="number" id="docenas" min="0" step="any" required>
    </p>
    <p>
        <label for="precio">Precio por unidad ($)</label>
        <input type="number" id="precio" min="0" step="0.01" required>
    </p>
    <button type="button" onclick="calcularCompra()">Calcular</button>
    <div id="resultado" role="status"></div>

    <script>
        function calcularCompra() {
            const valorDocenas = document.getElementById("docenas").value;
            const valorPrecio = document.getElementById("precio").value;
            const docenas = Number(valorDocenas);
            const precio = Number(valorPrecio);
            const resultado = document.getElementById("resultado");

            if (valorDocenas === "" || valorPrecio === "" || !Number.isFinite(docenas) ||
                !Number.isFinite(precio) || docenas < 0 || precio < 0) {
                resultado.innerHTML = "<p>Ingresa la cantidad de docenas y un precio. Ambos deben ser mayores o iguales a cero.</p>";
                return;
            }

            let porcentajeDescuento = 10;
            let obsequios = 0;
            if (docenas > 3) {
                porcentajeDescuento = 15;
                obsequios = Math.floor(docenas - 3);
            }

            const montoOriginal = Number((docenas * 12 * precio).toFixed(2));
            const descuento = Number((montoOriginal * porcentajeDescuento / 100).toFixed(2));
            const montoFinal = montoOriginal - descuento;

            resultado.innerHTML =
                "<p>Monto original: $" + montoOriginal.toFixed(2) + "</p>" +
                "<p>Descuento (" + porcentajeDescuento + "%): $" + descuento.toFixed(2) + "</p>" +
                "<p>Monto final a pagar: $" + montoFinal.toFixed(2) + "</p>" +
                "<p>Unidades de obsequio: " + obsequios + "</p>";
        }
    </script>
</body>
</html>
