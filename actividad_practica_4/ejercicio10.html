<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ejercicio 10 - Pago de estacionamiento</title>
</head>
<body>
    <h1>Pago de estacionamiento</h1>
    <p>
        <label for="horas">Horas de estacionamiento</label>
        <input type="number" id="horas" min="0" step="1" required>
    </p>
    <p>
        <label for="minutos">Minutos adicionales (0 a 59)</label>
        <input type="number" id="minutos" min="0" max="59" step="1" required>
    </p>
    <button type="button" onclick="calcularPago()">Calcular</button>
    <div id="resultado" role="status"></div>

    <script>
        function calcularPago() {
            const valorHoras = document.getElementById("horas").value;
            const valorMinutos = document.getElementById("minutos").value;
            const horas = Number(valorHoras);
            const minutos = Number(valorMinutos);
            const resultado = document.getElementById("resultado");

            if (valorHoras === "" || !Number.isInteger(horas) || horas < 0) {
                resultado.innerHTML = "<p>Ingresa una cantidad entera de horas mayor o igual a cero.</p>";
                return;
            }
            if (valorMinutos === "" || !Number.isInteger(minutos) || minutos < 0 || minutos > 59) {
                resultado.innerHTML = "<p>Ingresa una cantidad entera de minutos entre 0 y 59.</p>";
                return;
            }

            const horasCobradas = horas + Math.ceil(minutos / 60);
            const total = horasCobradas * 1.50;

            resultado.innerHTML =
                "<p>Tiempo ingresado: " + horas + " h y " + minutos + " min</p>" +
                "<p>Horas cobradas: " + horasCobradas + "</p>" +
                "<p>Total a pagar: $" + total.toFixed(2) + "</p>";
        }
    </script>
</body>
</html>
