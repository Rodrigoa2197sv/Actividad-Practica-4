<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ejercicio 9 - Promedio de prácticas</title>
</head>
<body>
    <h1>Promedio de prácticas</h1>
    <p>
        <label for="nota1">Nota 1</label>
        <input type="number" id="nota1" step="any" required>
    </p>
    <p>
        <label for="nota2">Nota 2</label>
        <input type="number" id="nota2" step="any" required>
    </p>
    <p>
        <label for="nota3">Nota 3</label>
        <input type="number" id="nota3" step="any" required>
    </p>
    <p>
        <label for="nota4">Nota 4</label>
        <input type="number" id="nota4" step="any" required>
    </p>
    <button type="button" onclick="calcularPromedio()">Calcular</button>
    <div id="resultado" role="status"></div>

    <script>
        function calcularPromedio() {
            const valorNota1 = document.getElementById("nota1").value;
            const valorNota2 = document.getElementById("nota2").value;
            const valorNota3 = document.getElementById("nota3").value;
            const valorNota4 = document.getElementById("nota4").value;
            const nota1 = Number(valorNota1);
            const nota2 = Number(valorNota2);
            const nota3 = Number(valorNota3);
            const nota4 = Number(valorNota4);
            const resultado = document.getElementById("resultado");

            if (valorNota1 === "" || valorNota2 === "" || valorNota3 === "" || valorNota4 === "" ||
                !Number.isFinite(nota1) || !Number.isFinite(nota2) ||
                !Number.isFinite(nota3) || !Number.isFinite(nota4)) {
                resultado.innerHTML = "<p>Ingresa cuatro notas numéricas.</p>";
                return;
            }

            const notaMenor = Math.min(nota1, nota2, nota3, nota4);
            const promedio = (nota1 + nota2 + nota3 + nota4 - notaMenor) / 3;

            resultado.innerHTML =
                "<p>Notas ingresadas: " + nota1 + ", " + nota2 + ", " + nota3 + " y " + nota4 + "</p>" +
                "<p>Nota eliminada: " + notaMenor + "</p>" +
                "<p>Promedio de las tres notas restantes: " + promedio.toFixed(2) + "</p>";
        }
    </script>
</body>
</html>
